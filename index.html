<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Executive Work Log & Calendar</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0066ff',
              600: '#0052cc',
              900: '#0b192c',
              gold: '#D4AF37'
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbars & Mobile Enhancements */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    .glass-panel {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .glass-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Mobile active button touch feedback */
    .touch-active:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    body {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans overflow-x-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-slate-100 selection:bg-blue-600 selection:text-white">

  <!-- Responsive Top Header -->
  <header class="glass-panel sticky top-0 z-30 px-4 sm:px-6 py-3 border-b border-slate-800/80 flex items-center justify-between shadow-2xl shrink-0">
    <div class="flex items-center space-x-2.5 sm:space-x-3">
      <div class="p-2 sm:p-2.5 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white shadow-lg shadow-blue-500/20 shrink-0">
        <i data-lucide="calendar" class="w-5 h-5 sm:w-6 sm:h-6"></i>
      </div>
      <div>
        <h1 class="text-base sm:text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400 leading-tight">
          Executive Calendar
        </h1>
        <p class="text-[10px] sm:text-xs text-slate-400">跨裝置工作日誌與主管匯報</p>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center space-x-2 sm:space-x-3">
      <button onclick="openModal()" class="touch-active flex items-center space-x-1.5 px-3 py-2 sm:px-4 sm:py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs sm:text-sm transition-all shadow-lg shadow-blue-600/30">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>新增紀錄</span>
      </button>
      <button onclick="openWeeklySummary()" class="touch-active flex items-center space-x-1.5 px-3 py-2 sm:px-4 sm:py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium text-xs sm:text-sm transition-all">
        <i data-lucide="file-text" class="w-4 h-4 text-emerald-400"></i>
        <span class="hidden sm:inline">週報／匯報</span>
        <span class="sm:hidden">週報</span>
      </button>
    </div>
  </header>

  <!-- Responsive Main Container -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-y-auto lg:overflow-hidden pb-16 lg:pb-0">
    
    <!-- Left Sidebar / Mobile Details Drawer -->
    <aside class="w-full lg:w-80 border-b lg:border-b-0 lg:border-r border-slate-800/80 flex flex-col bg-slate-950/40 shrink-0">
      
      <!-- Overdue & Priority Tasks Track -->
      <div class="p-3.5 sm:p-4 border-b border-slate-800/80">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
            <i data-lucide="alert-circle" class="w-4 h-4"></i> 待辦追蹤與交辦
          </span>
          <span id="overdueCount" class="px-2 py-0.5 text-xs rounded-full bg-amber-500/20 text-amber-300 font-bold">0</span>
        </div>
        <div id="alertList" class="space-y-2 max-h-36 sm:max-h-44 overflow-y-auto pr-1">
          <!-- Dynamic Overdue & Directive Items -->
        </div>
      </div>

      <!-- Selected Date Activity Log -->
      <div class="p-3.5 sm:p-4 flex-1 flex flex-col overflow-hidden">
        <div class="flex items-center justify-between mb-2.5">
          <div>
            <h2 id="selectedDateTitle" class="text-sm font-bold text-slate-200">今日事項</h2>
            <p id="selectedDateSub" class="text-[11px] text-slate-400">點擊日曆可切換查看日期</p>
          </div>
          <button onclick="openModal()" class="text-xs text-blue-400 hover:underline flex items-center gap-1 p-1">
            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 新增
          </button>
        </div>

        <div id="dayLogList" class="space-y-2.5 max-h-64 lg:max-h-none lg:flex-1 overflow-y-auto pr-1">
          <!-- Dynamic Selected Day Activity Logs -->
        </div>

        <!-- Daily Review Field -->
        <div class="mt-3 pt-3 border-t border-slate-800/80">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-medium text-slate-300 flex items-center gap-1">
              <i data-lucide="book-open" class="w-3.5 h-3.5 text-indigo-400"></i> 每日工作回顧
            </span>
            <button onclick="saveDailyReview()" class="touch-active text-xs font-semibold text-indigo-400 hover:text-indigo-300 px-2.5 py-1 rounded-lg bg-indigo-500/10 border border-indigo-500/20">儲存</button>
          </div>
          <textarea id="dailyReviewInput" rows="2" placeholder="紀錄今日心得、遇到問題或明日重點..." 
            class="w-full text-xs p-2.5 rounded-xl bg-slate-900 border border-slate-800 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none text-slate-200 placeholder-slate-600 resize-none"></textarea>
        </div>
      </div>
    </aside>

    <!-- Main Responsive Calendar Grid Area -->
    <main class="flex-1 flex flex-col min-h-[480px] sm:min-h-[550px] lg:min-h-0 bg-slate-900/30">
      
      <!-- Calendar Control Header -->
      <div class="px-3.5 sm:px-6 py-3 border-b border-slate-800/80 flex flex-wrap items-center justify-between gap-2 bg-slate-950/30">
        <div class="flex items-center space-x-2 sm:space-x-4">
          <div class="flex items-center space-x-1">
            <button onclick="changeMonth(-1)" class="touch-active p-2 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-slate-100 transition">
              <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <button onclick="goToday()" class="touch-active px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
              今天
            </button>
            <button onclick="changeMonth(1)" class="touch-active p-2 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-slate-100 transition">
              <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
          </div>
          <h2 id="currentMonthYear" class="text-base sm:text-lg font-bold text-slate-100"></h2>
        </div>

        <!-- Legend Categories -->
        <div class="flex items-center space-x-3 text-[11px] sm:text-xs text-slate-400">
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> 每日</span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> 交辦</span>
          <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 會議</span>
        </div>
      </div>

      <!-- Calendar Weekday Header -->
      <div class="grid grid-cols-7 border-b border-slate-800 bg-slate-950/60 text-center py-2 text-[11px] sm:text-xs font-semibold text-slate-400">
        <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
      </div>

      <!-- Days Grid (Full Fluid Width) -->
      <div id="calendarGrid" class="flex-1 grid grid-cols-7 grid-rows-6 gap-px bg-slate-800/50 overflow-y-auto">
        <!-- Dynamic Calendar Cells -->
      </div>
    </main>
  </div>

  <!-- Modal 1: Add/Edit Log Modal -->
  <div id="logModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/75 backdrop-blur-md hidden">
    <div class="glass-panel w-full max-w-md rounded-2xl p-4 sm:p-6 shadow-2xl border border-slate-700/80 space-y-4 max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-sm sm:text-base font-bold text-slate-100 flex items-center gap-2">
          <i data-lucide="edit-3" class="w-4 h-4 text-blue-400"></i> 新增活動紀錄
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 p-1.5 touch-active">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="logForm" onsubmit="handleFormSubmit(event)" class="space-y-3.5">
        <!-- Record Type Tabs -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5">紀錄類型</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="switchType('daily')" id="typeBtn-daily" class="py-2.5 text-xs font-medium rounded-xl border text-center transition touch-active">每日工作</button>
            <button type="button" onclick="switchType('directive')" id="typeBtn-directive" class="py-2.5 text-xs font-medium rounded-xl border text-center transition touch-active">主管交辦</button>
            <button type="button" onclick="switchType('event')" id="typeBtn-event" class="py-2.5 text-xs font-medium rounded-xl border text-center transition touch-active">會議行程</button>
          </div>
        </div>

        <!-- Date Picker -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">日期</label>
          <input type="date" id="inputDate" required class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-blue-500 outline-none">
        </div>

        <!-- Dynamic Fields per Type -->
        <!-- 1. Daily Work Fields -->
        <div id="fields-daily" class="space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">工作內容</label>
            <input type="text" id="dailyContent" placeholder="例如：撰寫產品開發規格書" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-blue-500 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">完成狀態</label>
              <select id="dailyStatus" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-blue-500 outline-none">
                <option value="進行中">進行中</option>
                <option value="已完成">已完成</option>
                <option value="延宕">延宕</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">耗時 (小時)</label>
              <input type="number" step="0.5" id="dailyHours" placeholder="1.5" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-blue-500 outline-none">
            </div>
          </div>
        </div>

        <!-- 2. Directive Fields -->
        <div id="fields-directive" class="space-y-3 hidden">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">交辦內容</label>
            <input type="text" id="directiveContent" placeholder="例如：整理 Q3 財務分析報告" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-amber-500 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">交辦人</label>
              <input type="text" id="directiveAssigner" placeholder="例如：Alex 副總" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-amber-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">優先級</label>
              <select id="directivePriority" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-amber-500 outline-none">
                <option value="High">🔴 高 (High)</option>
                <option value="Medium" selected>🟡 中 (Medium)</option>
                <option value="Low">🟢 低 (Low)</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">截止日期 (Deadline)</label>
              <input type="date" id="directiveDeadline" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-amber-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">狀態</label>
              <select id="directiveStatus" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-amber-500 outline-none">
                <option value="未完成">未完成</option>
                <option value="已完成">已完成</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 3. Meeting/Event Fields -->
        <div id="fields-event" class="space-y-3 hidden">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">行程/會議名稱</label>
            <input type="text" id="eventContent" placeholder="例如：跨部門戰略對齊會議" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-emerald-500 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">時間</label>
              <input type="time" id="eventTime" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">地點</label>
              <input type="text" id="eventLocation" placeholder="會議室 A / Teams" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-emerald-500 outline-none">
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">參與人</label>
            <input type="text" id="eventAttendees" placeholder="例如：PM 團隊, 設計師" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">備註</label>
            <input type="text" id="eventNotes" placeholder="攜帶 Q3 簡報資料" class="w-full text-xs p-2.5 sm:p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 focus:border-emerald-500 outline-none">
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex space-x-3 pt-3">
          <button type="button" onclick="closeModal()" class="touch-active w-1/2 py-2.5 sm:py-3 rounded-xl border border-slate-700 text-slate-300 text-xs font-medium hover:bg-slate-800">取消</button>
          <button type="submit" class="touch-active w-1/2 py-2.5 sm:py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium shadow-lg shadow-blue-600/30">儲存紀錄</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 2: Weekly Summary / Executive Report Modal -->
  <div id="weeklyModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-black/75 backdrop-blur-md hidden">
    <div class="glass-panel w-full max-w-2xl rounded-2xl p-4 sm:p-6 shadow-2xl border border-slate-700/80 space-y-4 max-h-[88vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-sm sm:text-base font-bold text-slate-100 flex items-center gap-2">
          <i data-lucide="file-check" class="w-5 h-5 text-emerald-400"></i> 每週工作摘要與主管匯報
        </h3>
        <button onclick="closeWeeklyModal()" class="text-slate-400 hover:text-slate-200 p-1.5 touch-active">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto space-y-4 pr-1 text-xs">
        <div class="p-3 rounded-xl bg-slate-900/80 border border-slate-800">
          <p class="text-slate-400 mb-1">📊 本週工作統計摘要</p>
          <div class="grid grid-cols-3 gap-2 sm:gap-3 text-center py-1">
            <div class="p-2 rounded-lg bg-slate-800/50">
              <span class="block text-slate-400 text-[10px]">總工作項目</span>
              <span id="statTotalWork" class="text-sm sm:text-base font-bold text-blue-400">0</span>
            </div>
            <div class="p-2 rounded-lg bg-slate-800/50">
              <span class="block text-slate-400 text-[10px]">完成交辦</span>
              <span id="statDirectivesDone" class="text-sm sm:text-base font-bold text-emerald-400">0</span>
            </div>
            <div class="p-2 rounded-lg bg-slate-800/50">
              <span class="block text-slate-400 text-[10px]">累積工時 (h)</span>
              <span id="statTotalHours" class="text-sm sm:text-base font-bold text-amber-400">0</span>
            </div>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-300 mb-1">匯報文案 (可直接複製傳送)</label>
          <textarea id="weeklyReportText" rows="9" class="w-full text-xs font-mono p-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-200 leading-relaxed outline-none focus:border-emerald-500"></textarea>
        </div>
      </div>

      <div class="flex justify-between items-center pt-3 border-t border-slate-800">
        <span class="text-[10px] sm:text-[11px] text-slate-500">自動整合當週工作紀錄</span>
        <button onclick="copyWeeklyReport()" class="touch-active px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-xs flex items-center gap-1.5 shadow-lg shadow-emerald-600/20">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i> 複製內文
        </button>
      </div>
    </div>
  </div>

  <script>
    // LocalStorage Initial State
    let logs = JSON.parse(localStorage.getItem('executive_work_logs')) || [
      {
        id: '1',
        type: 'daily',
        date: new Date().toISOString().split('T')[0],
        content: '完成跨裝置響應式架構重構',
        status: '已完成',
        hours: '3.0'
      },
      {
        id: '2',
        type: 'directive',
        date: new Date().toISOString().split('T')[0],
        content: '確認 Q4 行動端相容性測試',
        assigner: 'David 總監',
        priority: 'High',
        deadline: new Date().toISOString().split('T')[0],
        status: '未完成'
      },
      {
        id: '3',
        type: 'event',
        date: new Date().toISOString().split('T')[0],
        content: '週進度與系統對齊會議',
        time: '14:00',
        location: '線上 Teams',
        attendees: '核心團隊',
        notes: '預先準備簡報'
      }
    ];

    let dailyReviews = JSON.parse(localStorage.getItem('executive_daily_reviews')) || {};

    let currentDate = new Date();
    let selectedDateStr = new Date().toISOString().split('T')[0];
    let currentType = 'daily';

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      switchType('daily');
      renderCalendar();
      renderSelectedDayLogs();
      renderOverdueAlerts();
    });

    function saveData() {
      localStorage.setItem('executive_work_logs', JSON.stringify(logs));
      localStorage.setItem('executive_daily_reviews', JSON.stringify(dailyReviews));
    }

    function openModal(dateStr = null) {
      if (dateStr) selectedDateStr = dateStr;
      document.getElementById('inputDate').value = selectedDateStr;
      document.getElementById('logModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('logModal').classList.add('hidden');
    }

    function switchType(type) {
      currentType = type;
      ['daily', 'directive', 'event'].forEach(t => {
        const btn = document.getElementById(`typeBtn-${t}`);
        const fields = document.getElementById(`fields-${t}`);
        if (t === type) {
          btn.className = "py-2.5 text-xs font-medium rounded-xl border border-blue-500 bg-blue-500/20 text-blue-300 transition touch-active";
          fields.classList.remove('hidden');
        } else {
          btn.className = "py-2.5 text-xs font-medium rounded-xl border border-slate-800 bg-slate-900 text-slate-400 hover:bg-slate-800 transition touch-active";
          fields.classList.add('hidden');
        }
      });
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const date = document.getElementById('inputDate').value;
      
      const newLog = {
        id: Date.now().toString(),
        type: currentType,
        date: date
      };

      if (currentType === 'daily') {
        newLog.content = document.getElementById('dailyContent').value || '未命名工作';
        newLog.status = document.getElementById('dailyStatus').value;
        newLog.hours = document.getElementById('dailyHours').value || '1.0';
      } else if (currentType === 'directive') {
        newLog.content = document.getElementById('directiveContent').value || '未命名交辦事項';
        newLog.assigner = document.getElementById('directiveAssigner').value || '主管';
        newLog.priority = document.getElementById('directivePriority').value;
        newLog.deadline = document.getElementById('directiveDeadline').value || date;
        newLog.status = document.getElementById('directiveStatus').value;
      } else if (currentType === 'event') {
        newLog.content = document.getElementById('eventContent').value || '未命名會議';
        newLog.time = document.getElementById('eventTime').value || '09:00';
        newLog.location = document.getElementById('eventLocation').value || '會議室';
        newLog.attendees = document.getElementById('eventAttendees').value || '';
        newLog.notes = document.getElementById('eventNotes').value || '';
      }

      logs.push(newLog);
      saveData();
      closeModal();
      
      selectedDateStr = date;
      renderCalendar();
      renderSelectedDayLogs();
      renderOverdueAlerts();

      document.getElementById('logForm').reset();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('currentMonthYear').textContent = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "bg-slate-950/40 p-1 border-r border-b border-slate-800/40 opacity-30";
        grid.appendChild(emptyCell);
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayLogs = logs.filter(l => l.date === dateStr);
        const isSelected = dateStr === selectedDateStr;
        const isToday = dateStr === todayStr;

        const cell = document.createElement('div');
        cell.className = `p-1 sm:p-1.5 border-r border-b border-slate-800/60 transition-all cursor-pointer flex flex-col justify-between group hover:bg-slate-800/40 min-h-[70px] sm:min-h-[88px] ${
          isSelected ? 'bg-slate-800/80 ring-1 ring-blue-500/80' : 'bg-slate-950/20'
        }`;
        cell.onclick = () => selectDate(dateStr);

        const header = document.createElement('div');
        header.className = "flex justify-between items-center mb-1";
        
        const dayNum = document.createElement('span');
        dayNum.className = `text-[10px] sm:text-xs font-semibold px-1.5 py-0.5 rounded-full ${
          isToday ? 'bg-blue-600 text-white font-bold' : isSelected ? 'text-blue-400' : 'text-slate-400'
        }`;
        dayNum.textContent = day;

        header.appendChild(dayNum);
        cell.appendChild(header);

        const listContainer = document.createElement('div');
        listContainer.className = "space-y-1 overflow-hidden flex-1";

        dayLogs.slice(0, 2).forEach(item => {
          const itemEl = document.createElement('div');
          let tagColor = "bg-blue-500/20 text-blue-300 border-blue-500/30";
          if (item.type === 'directive') tagColor = "bg-amber-500/20 text-amber-300 border-amber-500/30";
          if (item.type === 'event') tagColor = "bg-emerald-500/20 text-emerald-300 border-emerald-500/30";

          itemEl.className = `text-[9px] sm:text-[10px] px-1 py-0.5 rounded border truncate ${tagColor}`;
          itemEl.textContent = item.content;
          listContainer.appendChild(itemEl);
        });

        if (dayLogs.length > 2) {
          const moreEl = document.createElement('div');
          moreEl.className = "text-[8px] sm:text-[9px] text-slate-500 font-medium pl-0.5";
          moreEl.textContent = `+${dayLogs.length - 2}`;
          listContainer.appendChild(moreEl);
        }

        cell.appendChild(listContainer);
        grid.appendChild(cell);
      }
    }

    function selectDate(dateStr) {
      selectedDateStr = dateStr;
      renderCalendar();
      renderSelectedDayLogs();
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function goToday() {
      currentDate = new Date();
      selectedDateStr = currentDate.toISOString().split('T')[0];
      renderCalendar();
      renderSelectedDayLogs();
    }

    function renderSelectedDayLogs() {
      const title = document.getElementById('selectedDateTitle');
      const sub = document.getElementById('selectedDateSub');
      const list = document.getElementById('dayLogList');

      title.textContent = `${selectedDateStr} 記錄詳情`;
      sub.textContent = `共 ${logs.filter(l => l.date === selectedDateStr).length} 筆活動項目`;

      const dayLogs = logs.filter(l => l.date === selectedDateStr);
      list.innerHTML = '';

      if (dayLogs.length === 0) {
        list.innerHTML = `
          <div class="text-center py-6 text-slate-600 text-xs">
            <i data-lucide="inbox" class="w-7 h-7 mx-auto mb-1.5 opacity-40"></i>
            無紀錄項目，點擊右上角新增
          </div>
        `;
        lucide.createIcons();
      } else {
        dayLogs.forEach(item => {
          const card = document.createElement('div');
          card.className = "p-2.5 sm:p-3 rounded-xl glass-card relative group border border-slate-800 hover:border-slate-700 transition";

          let typeBadge = '';
          if (item.type === 'daily') {
            typeBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] bg-blue-500/20 text-blue-400 font-medium">每日工作</span>`;
          } else if (item.type === 'directive') {
            typeBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] bg-amber-500/20 text-amber-400 font-medium">主管交辦</span>`;
          } else {
            typeBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] bg-emerald-500/20 text-emerald-400 font-medium">會議行程</span>`;
          }

          let extraInfo = '';
          if (item.type === 'daily') {
            extraInfo = `<div class="mt-1 flex items-center justify-between text-[11px] text-slate-400">
              <span>狀態: <strong class="text-slate-200">${item.status}</strong></span>
              <span>耗時: <strong>${item.hours}h</strong></span>
            </div>`;
          } else if (item.type === 'directive') {
            extraInfo = `<div class="mt-1 text-[11px] text-slate-400 space-y-0.5">
              <div class="flex justify-between"><span>交辦人: ${item.assigner}</span> <span>優先級: ${item.priority}</span></div>
              <div class="flex justify-between"><span>期限: ${item.deadline}</span> <span class="${item.status === '已完成' ? 'text-emerald-400' : 'text-amber-400'}">${item.status}</span></div>
            </div>`;
          } else if (item.type === 'event') {
            extraInfo = `<div class="mt-1 text-[11px] text-slate-400">
              <div>時間: ${item.time} | 地點: ${item.location}</div>
              ${item.attendees ? `<div>參與人: ${item.attendees}</div>` : ''}
            </div>`;
          }

          card.innerHTML = `
            <div class="flex justify-between items-start mb-1">
              ${typeBadge}
              <button onclick="deleteLog('${item.id}')" class="text-slate-500 hover:text-red-400 transition p-1 touch-active">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
            <p class="text-xs font-semibold text-slate-200 mt-0.5">${item.content}</p>
            ${extraInfo}
          `;
          list.appendChild(card);
        });
        lucide.createIcons();
      }

      const reviewInput = document.getElementById('dailyReviewInput');
      reviewInput.value = dailyReviews[selectedDateStr] || '';
    }

    function deleteLog(id) {
      logs = logs.filter(l => l.id !== id);
      saveData();
      renderCalendar();
      renderSelectedDayLogs();
      renderOverdueAlerts();
    }

    function saveDailyReview() {
      const text = document.getElementById('dailyReviewInput').value;
      dailyReviews[selectedDateStr] = text;
      saveData();
      alert('每日工作回顧已成功儲存！');
    }

    function renderOverdueAlerts() {
      const alertList = document.getElementById('alertList');
      const overdueCount = document.getElementById('overdueCount');
      const today = new Date().toISOString().split('T')[0];

      const pendingDirectives = logs.filter(l => l.type === 'directive' && l.status !== '已完成');
      overdueCount.textContent = pendingDirectives.length;

      alertList.innerHTML = '';

      if (pendingDirectives.length === 0) {
        alertList.innerHTML = `<p class="text-[11px] text-slate-500 text-center py-1.5">目前無延宕或待辦事項</p>`;
      } else {
        pendingDirectives.forEach(item => {
          const isOverdue = item.deadline < today;
          const el = document.createElement('div');
          el.className = `p-2 rounded-xl border text-xs flex justify-between items-center ${
            isOverdue ? 'bg-red-500/10 border-red-500/30 text-red-300' : 'bg-amber-500/10 border-amber-500/30 text-amber-300'
          }`;

          el.innerHTML = `
            <div class="truncate pr-2">
              <div class="font-medium truncate text-xs">${item.content}</div>
              <div class="text-[10px] opacity-80">期限: ${item.deadline} (${item.assigner})</div>
            </div>
            <button onclick="toggleDirectiveDone('${item.id}')" class="touch-active shrink-0 px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-emerald-600 text-[10px] text-slate-200 hover:text-white transition">
              完成
            </button>
          `;
          alertList.appendChild(el);
        });
      }
    }

    function toggleDirectiveDone(id) {
      const item = logs.find(l => l.id === id);
      if (item) {
        item.status = '已完成';
        saveData();
        renderCalendar();
        renderSelectedDayLogs();
        renderOverdueAlerts();
      }
    }

    function openWeeklySummary() {
      const totalWork = logs.filter(l => l.type === 'daily').length;
      const directivesDone = logs.filter(l => l.type === 'directive' && l.status === '已完成').length;
      const totalHours = logs.filter(l => l.type === 'daily').reduce((acc, curr) => acc + (parseFloat(curr.hours) || 0), 0);

      document.getElementById('statTotalWork').textContent = totalWork;
      document.getElementById('statDirectivesDone').textContent = directivesDone;
      document.getElementById('statTotalHours').textContent = totalHours;

      let reportText = `📌 【工作週報與重點回報】\n報告日期: ${new Date().toLocaleDateString('zh-TW')}\n\n`;
      
      reportText += `一、 主管交辦事項與重點進度：\n`;
      const directives = logs.filter(l => l.type === 'directive');
      if (directives.length === 0) reportText += `  - 無特定交辦紀錄\n`;
      directives.forEach(d => {
        reportText += `  • [${d.status}] ${d.content} (交辦人: ${d.assigner} / 期限: ${d.deadline})\n`;
      });

      reportText += `\n二、 每日主要工作執行紀錄：\n`;
      const dailyWork = logs.filter(l => l.type === 'daily');
      if (dailyWork.length === 0) reportText += `  - 本週尚無常規工作紀錄\n`;
      dailyWork.forEach(w => {
        reportText += `  • [${w.date}] ${w.content} (${w.status}, 投入 ${w.hours} 小時)\n`;
      });

      reportText += `\n三、 重要會議與行程摘要：\n`;
      const events = logs.filter(l => l.type === 'event');
      if (events.length === 0) reportText += `  - 無特定會議紀錄\n`;
      events.forEach(e => {
        reportText += `  • [${e.date} ${e.time}] ${e.content} (${e.location})\n`;
      });

      reportText += `\n四、 本週工作回顧與心得：\n`;
      Object.keys(dailyReviews).forEach(dateKey => {
        if (dailyReviews[dateKey]) {
          reportText += `  • [${dateKey}] ${dailyReviews[dateKey]}\n`;
        }
      });

      document.getElementById('weeklyReportText').value = reportText;
      document.getElementById('weeklyModal').classList.remove('hidden');
    }

    function closeWeeklyModal() {
      document.getElementById('weeklyModal').classList.add('hidden');
    }

    function copyWeeklyReport() {
      const text = document.getElementById('weeklyReportText');
      text.select();
      document.execCommand('copy');
      alert('匯報內文已成功複製到剪貼簿！');
    }
  </script>
</body>
</html>
